[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pizpuzim"
version = "0.1.0"
description = "Personal LangGraph assistant for Telegram, Gmail, and Google Calendar."
requires-python = ">=3.10"
dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-openai",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "python-telegram-bot",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pizpuzim = "service:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["config", "history", "service"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
